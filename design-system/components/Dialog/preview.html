<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Dialog — 预览</title><style>.xz-tabs--wrap{flex-wrap:wrap;padding:0}</style></head>
<body>
<div id="root"></div>
<script>
var X = window.Xiaozao, h = React.createElement;
function Box(child, overlay) {
  return h('div', { style: { position: 'relative', width: 375, height: 380, overflow: 'hidden', borderRadius: 'var(--radius-xl)', background: 'var(--surface)' } },
    h('div', { className: 'xz-list', style: { paddingTop: 'var(--space-3)' } }, child), overlay);
}
var row = h(X.ProductRow, { name: '红烧牛肉面（大碗）', price: 28, stock: 36, sales: '1200+', status: 'on' });
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'xz-row', style: { padding: 'var(--space-3)', alignItems: 'flex-start', flexWrap: 'nowrap' } },
    Box(row, h(X.Dialog, { title: '确认下架“红烧牛肉面（大碗）”？', actions: [{ label: '取消' }, { label: '确认下架' }] }, '下架后用户将看不到这道菜，可随时重新上架。')),
    Box(h(X.MerchantRow, { name: '阿香米线（望京店）', category: '米粉面馆', city: '北京', joined: '11-10', status: 'pending' }),
      h(X.Dialog, { variant: 'sheet', title: '驳回原因', actions: [{ label: '取消' }, { label: '确认驳回', variant: 'danger' }] },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--space-2)', marginTop: 'var(--space-2)' } },
          h(X.Tabs, { variant: 'chip', items: ['营业执照模糊', '许可证过期', '门店照片不符'], className: 'xz-tabs--wrap' }))))));
</script>
</body>
</html>
