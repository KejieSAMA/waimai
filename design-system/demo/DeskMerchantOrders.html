<meta charset="utf-8"><title>DeskMerchantOrders — 预览</title><style>

.ds-chips { padding: 0; flex-wrap: wrap; }

.ds-group { margin: 0 0 var(--space-3); color: var(--ink-muted); }

.ds-dishes .xz-dish { border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.ds-account { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.ds-orders { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); align-items: start; }

    col('配送中', h(X.Tag, { tone: 'info' }, '5'), F(
      h(X.OrderCard, { view: 'merchant', serial: 9, title: '外卖 · 尾号 2093', status: 'delivering', items: [{ name: '番茄肥牛面', qty: 2, price: 52 }], total: 49, time: '骑手已取餐 · 预计 12:20 送达', actions: [{ label: '联系骑手' }] }),
      h(X.OrderCard, { view: 'merchant', serial: 10, title: '外卖 · 尾号 6634', status: 'delivering', items: [{ name: '卤牛肉拼盘', qty: 1, price: 38 }], total: 41, time: '骑手已取餐 · 预计 12:25 送达', actions: [{ label: '联系骑手' }] }))),

      h(X.OrderCard, { view: 'merchant', serial: 7, title: '外卖 · 尾号 1178', status: 'refunding', items: [{ name: '红烧牛肉面（大碗）', qty: 1, price: 28 }, { name: '卤蛋', qty: 1, price: 3 }], total: 31, time: '用户 11:52 申请', note: '漏送卤蛋，申请退 ¥3', actions: [{ label: '拒绝', variant: 'danger-outline' }, { label: '同意退款', variant: 'primary' }] }))))));
