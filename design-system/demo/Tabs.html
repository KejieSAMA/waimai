<html lang="zh-CN">
<head>

<link rel="stylesheet" href="assets/tokens.css">

<body>
<div id="root"></div>
<script>
var X = window.Xiaozao, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'xz-demo', style: { gap: 'var(--space-3)' } },
    h('div', { style: { borderRadius: 'var(--radius-lg)', overflow: 'hidden' } },
      h(X.Tabs, { items: [{ key: 'new', label: '新订单', count: 3, alert: true }, { key: 'prep', label: '备餐中', count: 2 }, { key: 'send', label: '配送中' }, { key: 'refund', label: '退款', count: 1 }] })),
    h('div', { style: { background: 'var(--surface-raised)', borderRadius: 'var(--radius-lg)' } },
      h(X.Tabs, { variant: 'chip', items: ['全部', '快餐便当', '米粉面馆', '奶茶饮品', '烧烤夜宵', '甜品'] }))));
</script>
