<!doctype html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/bundle.css">
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/bundle.js"></script>

<meta charset="utf-8">
<title>小灶</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .brand { fill: var(--brand); }
  .accent { fill: var(--accent); }
  .deep { fill: var(--ink); }
  .cut { fill: var(--brand-soft); }
  .blk { rx: var(--radius-lg); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: .02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body style="max-width:960px">
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      brand 176×240 bled off the top (the identity, largest) · accent 120×144 (the promo yellow) · ink 176×208 bleeding off the right edge (the deep ground of chrome bars) · brand pill 96×32 once (every button is a pill) — about 30% of 960×288
  arrangement one tall brand slab with satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     half-rounds + pills, from "按钮、搜索框、步进器全部 radius-pill" and the bowl that stands in for every dish photo: pill rows thinning upward cut into the slab in brand-soft (steam off the stove), a space-6×2-pitch grid of half-discs (bowls) on the ink block in brand, one large half-disc on the accent; one row of brand-soft pills under the bowls
  scales      sides in space-2 multiples; gutters space-4; pitch space-6 × 2; bowls 32 / 96 wide; corners radius-lg; pills rx half their height (radius-sm, radius-pill)
-->
<rect class="brand blk" x="0" y="-24" width="176" height="240" rx="12"/>
<rect class="brand" x="0" y="232" width="96" height="32" rx="16"/>
<rect class="accent blk" x="192" y="120" width="120" height="144" rx="12"/>
<rect class="deep blk" x="328" y="56" width="176" height="208" rx="12"/>

<rect class="cut" x="24" y="192" width="40" height="8" rx="4"/>
<rect class="cut" x="72" y="192" width="56" height="8" rx="4"/>
<rect class="cut" x="136" y="192" width="24" height="8" rx="4"/>
<rect class="cut" x="40" y="168" width="24" height="8" rx="4"/>
<rect class="cut" x="72" y="168" width="40" height="8" rx="4"/>
<rect class="cut" x="120" y="168" width="32" height="8" rx="4"/>
<rect class="cut" x="56" y="144" width="32" height="8" rx="4"/>
<rect class="cut" x="96" y="144" width="24" height="8" rx="4"/>
<rect class="cut" x="48" y="120" width="24" height="8" rx="4"/>
<rect class="cut" x="88" y="120" width="32" height="8" rx="4"/>
<rect class="cut" x="72" y="96" width="24" height="8" rx="4"/>

<path class="brand" d="M204 160h96a48 48 0 0 1 -96 0z"/>

<path class="brand" d="M352 88h32a16 16 0 0 1 -32 0z"/>
<path class="brand" d="M400 88h32a16 16 0 0 1 -32 0z"/>
<path class="brand" d="M448 88h32a16 16 0 0 1 -32 0z"/>
<path class="brand" d="M352 136h32a16 16 0 0 1 -32 0z"/>
<path class="brand" d="M400 136h32a16 16 0 0 1 -32 0z"/>
<path class="brand" d="M448 136h32a16 16 0 0 1 -32 0z"/>
<rect class="cut" x="352" y="216" width="40" height="8" rx="4"/>
<rect class="cut" x="400" y="216" width="24" height="8" rx="4"/>
<rect class="cut" x="432" y="216" width="48" height="8" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">小灶</h1>
<p class="tag">三端一套：用户点餐，商家经营，平台统筹。</p>
</div>
</div>
</body>
</html>
