<!doctype html>
<html lang="zh-CN">
<head>

<meta charset="utf-8"><title>UserStore — 预览</title><style>
.sc-sort { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-3); color: var(--ink-muted); }
.sc-sort b { color: var(--ink); font-weight: 600; }
.sc-sort span { display: inline-flex; align-items: center; gap: 2px; }
.sc-sort .sc-push { margin-left: auto; }
.sc-strip { background: var(--surface-raised); }
.sc-head { display: flex; gap: var(--space-3); padding: var(--space-3); background: var(--surface-raised); }
.sc-head__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.sc-muted { color: var(--ink-muted); }
.sc-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); }
.sc-fill { height: 100%; display: flex; flex-direction: column; }
.sc-split { flex: 1; min-height: 0; display: flex; background: var(--surface-raised); }
.sc-split__list { flex: 1; min-width: 0; overflow-y: auto; padding-bottom: 96px; scrollbar-width: none; }
.sc-group { padding: var(--space-2) var(--space-3) 0; color: var(--ink-muted); }
.sc-fab { position: absolute; right: var(--space-3); bottom: calc(var(--size-tabbar) + var(--size-safe-bottom) + var(--space-3)); z-index: 6; }
.sc-fab .xz-btn { box-shadow: var(--shadow-float); }
.sc-actions { display: flex; gap: var(--space-2); padding: var(--space-2) var(--space-3); }
.sc-actions > :first-child { flex: 0 0 34%; }
.sc-actions > :last-child { flex: 1; }
.sc-upload { display: flex; gap: var(--space-2); }
.sc-upload__add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); width: var(--size-thumb); height: var(--size-thumb); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--ink-muted); }
.sc-card { margin: 0 var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); background: var(--surface-raised); box-shadow: var(--shadow-card); }
.sc-form { margin: 0 var(--space-3); overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.sc-docs { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.sc-doc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); aspect-ratio: 4 / 3; border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--ink-muted); text-align: center; }
.sc-doc b { color: var(--ink); font-weight: 600; }
.sc-rank { display: inline-block; width: 20px; color: var(--brand-text); font-family: var(--font-num); font-weight: 600; }
.sc-hero .xz-stat { padding: var(--space-2) var(--space-1) var(--space-1); }
</style></head>
<body>
<div id="root"></div>
<script>
var X = window.Xiaozao, h = React.createElement;
function mount(page) { ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'xz-stage' }, h('div', { className: 'xz-device' }, page))); }
function section(title, more) { return h('div', { className: 'xz-section' }, h('span', { className: 'title-sm' }, title), more ? h('span', { className: 'xz-section__more body-sm' }, more) : null); }

mount(h(X.MobilePage, {
  navBar: h(X.NavBar, { back: true, bordered: false, right: h(React.Fragment, null, h(X.NavBar.Icon, { name: 'search', label: '搜索菜品' }), h(X.NavBar.Icon, { name: 'more', label: '更多' })) }),
  bottomTone: 'clear',
  bottom: h(X.CartBar, { count: 3, total: 56.5, deliveryFee: 3, minOrder: 20 })
},
  h('div', { className: 'sc-fill' },
    h('div', { className: 'sc-head' },
      h('span', { className: 'xz-logo' }, h('span', { className: 'title-lg' }, '老')),
      h('div', { className: 'sc-head__main' },
        h('span', { className: 'title-lg' }, '老张家牛肉面'),
        h('span', { className: 'body-sm sc-muted' }, '评分 4.8 · 月售 3000+ · 约 30 分钟'),
        h('div', { className: 'sc-tags' }, h(X.Tag, { tone: 'brand', variant: 'outline' }, '满 30 减 5'), h(X.Tag, { tone: 'brand', variant: 'outline' }, '满 50 减 10'), h(X.Tag, { tone: 'brand', variant: 'outline' }, '首单立减 8')))),
    h(X.Tabs, { items: ['点菜', '评价 4.8', '商家'] }),
    h('div', { className: 'sc-split' },
      h(X.CategoryNav, { items: [{ key: 'hot', label: '热销' }, { key: 'noodle', label: '招牌面', count: 2 }, { key: 'rice', label: '盖浇饭' }, { key: 'side', label: '小菜', count: 1 }, { key: 'drink', label: '饮品' }, { key: 'set', label: '套餐' }], defaultValue: 'noodle' }),
      h('div', { className: 'sc-split__list' },
        h('div', { className: 'sc-group body-sm' }, '招牌面'),
        h(X.DishCard, { name: '红烧牛肉面（大碗）', desc: '汤底每日现熬，牛肉选用牛腱', sales: '1200+', price: 28, original: 32, tags: ['招牌'], count: 1 }),
        h(X.DishCard, { name: '番茄肥牛面', desc: '酸甜番茄汤底，肥牛现切', sales: '860+', price: 26, count: 1 }),
        h(X.DishCard, { name: '藤椒鸡丝凉面', desc: '微麻，夏季限定', sales: '420+', price: 22 }),
        h('div', { className: 'sc-group body-sm' }, '小菜'),
        h(X.DishCard, { name: '卤蛋', desc: '老汤卤制', sales: '2000+', price: 3, count: 1 }),
        h(X.DishCard, { name: '卤牛肉拼盘', desc: '五香卤制，冷吃', sales: '300+', price: 38, soldOut: true }))))));
</script>
