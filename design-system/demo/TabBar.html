<!doctype html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/bundle.css">
<script src="assets/react.production.min.js"></script>
<script src="assets/react-dom.production.min.js"></script>
<script src="assets/bundle.js"></script>
<meta charset="utf-8"><title>TabBar — 预览</title></head>
<body>
<div id="root"></div>
<script>
var X = window.Xiaozao, h = React.createElement;
function Row(label, el) {
  return h('div', null, h('div', { className: 'caption', style: { color: 'var(--ink-muted)', margin: '0 0 var(--space-1)' } }, label),
    h('div', { style: { borderRadius: 'var(--radius-lg)', overflow: 'hidden', boxShadow: 'var(--shadow-card)' } }, el));
}
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div', { className: 'xz-demo', style: { gap: 'var(--space-3)' } },
    Row('用户端', h(X.TabBar, { role: 'user', badges: { orders: 1 } })),
    Row('商家端', h(X.TabBar, { role: 'merchant', defaultValue: 'orders', badges: { orders: 3 } })),
    Row('管理端', h(X.TabBar, { role: 'admin', defaultValue: 'merchants', badges: { audit: 12 } }))));
</script>
</body>
</html>
